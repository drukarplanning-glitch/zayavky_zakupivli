<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявки на закупівлю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тихий робочий інструмент, як аркуш обліку на складі
   IDEA: накладна / журнал заявок — рядки, штампи статусів, папки-групи
   PICTURE: сам журнал заявок одразу під заголовком
   COLOUR and TYPE: білий, смарагдовий #00a86b, блідо-рожевий для груп; Schibsted Grotesk
   LAYOUT: шапка з вкладками, ліворуч групи (цілі для перетягування), праворуч журнал */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1410);--ink:light-dark(#111614,#e7eee9);--mute:light-dark(#5d6762,#9aa8a1);
--line:light-dark(#e4e8e6,#22302a);--soft:light-dark(#f4f7f5,#121d18);--acc:light-dark(#00a86b,#2fd093);
--accInk:light-dark(#ffffff,#04140d);--pink:light-dark(#ffd6e0,#4a2530);--pinkInk:light-dark(#6b1f33,#ffd6e0);
--c-new:light-dark(#5f6b66,#a7b3ad);--c-invoice:light-dark(#a15c00,#f0b45b);--c-pay:light-dark(#1d5bd6,#7aa7ff);
--c-paid:light-dark(#6d32d9,#b99bff);--c-got:light-dark(#00804f,#2fd093)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px max(3vw,16px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--acc);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px 6px;border:2px solid var(--accInk);border-top:0;border-radius:0 0 3px 3px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:10px 14px;border-radius:8px;font-weight:600;color:var(--mute);min-height:44px}
.tab[aria-current=true]{background:var(--soft);color:var(--ink)}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.who select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px;font-size:15px}
.demo{font-size:13px;color:var(--mute);padding:8px max(3vw,16px);background:var(--soft);border-bottom:1px solid var(--line)}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;min-height:calc(100vh - 110px)}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
.side{border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side h3{font-size:13px;color:var(--mute);margin:0 8px 6px;font-weight:600}
.g{display:flex;align-items:center;gap:8px;width:100%;text-align:start;border:1px dashed transparent;background:none;padding:9px 10px;border-radius:8px;min-height:42px}
.g span{margin-inline-start:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.g.on{background:var(--soft);font-weight:700}
.g.folder::before{content:"";width:14px;height:11px;border-radius:2px;background:var(--pink);flex:none;box-shadow:inset 0 3px 0 color-mix(in srgb,var(--pinkInk) 25%,transparent)}
.g.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.g .x{opacity:0;border:0;background:none;color:var(--mute);padding:0 4px;font-size:16px}
.g:hover .x,.g:focus-within .x{opacity:1}
.ng{display:flex;gap:6px;margin-top:10px}
.ng input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px}
.hint{font-size:13px;color:var(--mute);margin:10px 8px 0}
main{padding:20px max(2.5vw,16px) 60px}
h1{font-size:32px;line-height:1.05;margin:0 0 4px;font-weight:800;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.bar select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.btn{border:1px solid var(--line);background:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;min-height:44px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn.warn{color:#c2253d}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px;min-height:36px;display:flex;gap:6px;align-items:center}
.chip b{font-variant-numeric:tabular-nums;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--pink);color:var(--pinkInk);margin-bottom:12px;font-size:15px}
.bulk select{padding:6px 8px;border-radius:6px;border:0;background:var(--bg);color:var(--ink);min-height:36px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mute);font-weight:600;text-align:start;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr[data-id]{cursor:pointer}
tr[data-id]:hover td{background:var(--soft)}
tr.sel td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
tr.dragging{opacity:.4}
td small{display:block;color:var(--mute);font-size:13px}
.nm b{font-weight:600}
.lnk{display:block;font-size:13px;color:var(--acc);text-decoration:none;overflow-wrap:anywhere}
.lnk:hover{text-decoration:underline}
.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.urg{display:inline-block;margin-inline-start:6px;font-size:12px;color:#c2253d;border:1px solid currentColor;border-radius:4px;padding:0 5px;vertical-align:2px}
.gp{display:inline-block;background:var(--pink);color:var(--pinkInk);border-radius:5px;padding:1px 7px;font-size:13px;white-space:nowrap}
.st{--c:var(--c-new);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:6px;padding:4px 8px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-block}
select.st{min-height:36px;padding-inline-end:4px}
.s-invoice{--c:var(--c-invoice)}.s-pay{--c:var(--c-pay)}.s-paid{--c:var(--c-paid)}.s-got{--c:var(--c-got)}
.ck{width:36px}.ck input{width:20px;height:20px;accent-color:var(--acc)}
tr.sec td{background:var(--soft);font-weight:700;padding:10px 8px;cursor:default}
tr.sec .btn{margin-inline-start:10px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.ovl{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:20;display:flex;justify-content:flex-end}
.ovl.center{justify-content:center;align-items:flex-start;padding:5vh 12px;overflow:auto}
.panel{background:var(--bg);width:min(480px,100%);height:100%;overflow:auto;padding:22px;border-inline-start:1px solid var(--line)}
.center .panel{height:auto;border-radius:14px;border:1px solid var(--line)}
.panel h2{font-size:22px;margin:0 0 4px;line-height:1.2}
.f{display:block;margin:12px 0 0;font-size:14px;color:var(--mute)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.box{border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px;margin-top:16px}
.box legend{font-weight:700;padding:0 6px;font-size:14px}
.err{color:#c2253d;font-size:14px;min-height:20px;margin:8px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hist{font-size:14px;color:var(--mute);margin:14px 0 0;padding-inline-start:18px}
.cres{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:210px;overflow:auto}
.cres button{text-align:start;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px}
.cres small{color:var(--mute)}
.picked{font-size:14px;margin-top:6px;color:var(--acc)}
.sups{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 110px)}
.sl{border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.sl input{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px;min-height:44px}
.si{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:start;border:0;background:none;padding:10px;border-radius:8px}
.si.on{background:var(--soft)}
.si b{font-weight:600}.si small{color:var(--mute);font-size:13px;grid-column:1}
.si em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;background:var(--acc);color:var(--accInk);font-weight:700;border-radius:99px;padding:2px 9px;font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.wait{background:color-mix(in srgb,var(--acc) 9%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:12px;padding:14px;margin:12px 0 18px}
.wait h3{margin:0 0 8px;font-size:17px}
.wait ul{margin:0 0 12px;padding-inline-start:18px;font-size:15px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:30;transition:opacity .2s}
.card{max-width:560px;margin:32px auto;padding:24px;border:1px solid var(--line);border-radius:14px}
code{background:var(--soft);padding:1px 5px;border-radius:4px}
footer{padding:16px max(3vw,16px);font-size:13px;color:var(--mute);border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:820px){.wrap,.sups{grid-template-columns:minmax(0,1fr)}.side,.sl{border-inline-end:0;border-bottom:1px solid var(--line)}.side{flex-direction:row;flex-wrap:wrap}.side h3,.hint{width:100%}.g{width:auto}.ng{width:100%}.who{margin-inline-start:0;width:100%}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:13px}.stack td:empty{display:none}.stack tr.sec{display:block}.stack tr.sec td{padding:8px}.stack tr.sec td::before{display:none}h1{font-size:26px}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <div class="logo"><i></i>Закупівлі</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who" id="who"></div>
</header>
<div id="app"></div>
<footer><span>Заявки на закупівлю</span><button class="btn sm" id="reload">Оновити</button></footer>
<div id="ov"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
{
/* ======== НАЛАШТУВАННЯ: вставте дані з Supabase → Project Settings → API ======== */
const SUPABASE_URL = 'https://tyrqelewszgzegdcpkew.supabase.co';       // напр. 'https://abcdefgh.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cnFlbGV3c3pnemVnZGNwa2V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMzE1NjgsImV4cCI6MjExMDYwNzU2OH0.64rxeVxn-e-umfBYU95E7SfaIgY8T6cD0n8k17UZ3rM';  // ключ "anon public" (НЕ service_role!)
/* ================================================================================ */

const T={req:'zk_requests',pub:'zk_requests_public',sup:'zk_suppliers',pos:'zk_positions',grp:'zk_groups'};
const ST=[{k:'new',t:'Не замовлено'},{k:'invoice',t:'Очікую рахунок'},{k:'pay',t:'Подав на оплату'},{k:'paid',t:'Оплачено'},{k:'got',t:'Отримано'}];
const CAR=['Нова пошта','Укрпошта','Meest','Делівері','САТ',"Кур'єр постачальника",'Самовивіз','Інше'];
const UNITS=['шт','уп','компл','пачка','котушка','кг','м','л'];
const DEPTS=['Керівник локації','ІТО','Склад','Лабораторія','Закупівлі','Бухгалтерія'];

let sb=null,isA=false,email='';
let D={requests:[],suppliers:[],positions:[],groups:[]};
const U={tab:'req',group:'all',status:'all',q:'',by:'none',sel:new Set(),sup:null,supF:null,sq:'',loading:true,err:''};
let ME={name:'',dept:''};
try{ME={...ME,...JSON.parse(localStorage.getItem('zk-me')||'{}')}}catch(e){}
const saveMe=()=>{try{localStorage.setItem('zk-me',JSON.stringify(ME))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stT=k=>ST.find(s=>s.k===k)?.t||k;
const sup=id=>D.suppliers.find(s=>s.id===id);
const grp=id=>D.groups.find(g=>g.id===id);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const guessSup=url=>{const h=host(url);return h?D.suppliers.find(s=>s.site&&h.endsWith(s.site))?.id||null:null};
const dt=t=>new Date(t).toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'});
const dtt=t=>new Date(t).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const money=n=>n==null||n===''?'':Number(n).toLocaleString('uk-UA',{maximumFractionDigits:2})+' грн';
const opts=(arr,cur)=>arr.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('');
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const nowIso=()=>new Date().toISOString();
let tt;
function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.append(el)}el.textContent=m;el.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>el.style.opacity=0,2600)}

/* ---------- база ---------- */
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}
async function loadAll(){
  try{
    const [req,sups,pos,grs]=await Promise.all([
      q(sb.from(isA?T.req:T.pub).select('*').order('created_at',{ascending:false})),
      q(sb.from(T.sup).select(isA?'*':'id,name,site').order('name')),
      q(sb.from(T.pos).select('*').order('title')),
      isA?q(sb.from(T.grp).select('*').order('created_at')):Promise.resolve([])]);
    D={requests:req||[],suppliers:sups||[],positions:pos||[],groups:grs||[]};U.err='';
  }catch(e){U.err=e.message||String(e)}
  U.loading=false;
  for(const id of [...U.sel])if(!D.requests.some(r=>r.id===id))U.sel.delete(id);
  render();
}
async function act(fn,msg){try{await fn();if(msg)toast(msg)}catch(e){toast('Помилка: '+(e.message||e))}await loadAll()}
const statusPatch=(r,k)=>({status:k,hist:[...(r.hist||[]),{t:nowIso(),s:k,by:email}]});
function upsertPos(r){
  const row={sup_id:r.sup_id,title:r.title,url:r.url,unit:r.unit};
  if(r.amount&&r.qty)row.price=Math.round(r.amount/r.qty*100)/100;
  return q(sb.from(T.pos).upsert(row,{onConflict:'url'}));
}
async function setStatus(rs,k){
  rs=rs.filter(r=>r.status!==k);
  await Promise.all(rs.map(r=>q(sb.from(T.req).update(statusPatch(r,k)).eq('id',r.id))));
  if(k!=='new')await Promise.all(rs.filter(r=>r.sup_id).map(upsertPos));
  return rs.length;
}
async function checkAdmin(){
  isA=false;email='';
  const {data}=await sb.auth.getSession();const s=data&&data.session;
  if(!s)return;
  const r=await sb.rpc('zk_is_admin');
  if(r.data===true){isA=true;email=s.user.email}else{await sb.auth.signOut()}
}

/* ---------- відображення ---------- */
function scoped(){
  let r=D.requests;
  if(!isA)r=r.filter(x=>norm(x.author_name)===norm(ME.name));
  else{if(U.group==='none')r=r.filter(x=>!x.group_id);else if(U.group!=='all')r=r.filter(x=>x.group_id===U.group)}
  if(U.supF)r=r.filter(x=>x.sup_id===U.supF);
  if(U.q){const s=U.q.toLowerCase();r=r.filter(x=>[x.title,x.url,x.author_name,x.author_dept,sup(x.sup_id)?.name,x.inv,x.vn,x.ttn,x.note].join(' ').toLowerCase().includes(s))}
  return r;
}
function render(){
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  $('#tabs').innerHTML=sb&&!U.err?[['req',isA?'Заявки':'Мої заявки'],['sup',isA?'Постачальники':'Каталог']].map(([k,t])=>`<button class="tab" data-tab="${k}" aria-current="${U.tab===k}">${t}</button>`).join(''):'';
  $('#who').innerHTML=!sb?'':isA?`<span>Закупівлі: <b>${esc(email)}</b></span><button class="btn sm" data-logout>Вийти</button>`
    :`${ME.name?`<span>Ви: <b>${esc(ME.name)}</b>${ME.dept?' · '+esc(ME.dept):''}</span><button class="btn sm" data-setme>Змінити</button>`:''}<button class="btn sm" data-login>Вхід для закупівель</button>`;
  $('#app').innerHTML=!sb?setupView():U.loading?'<p class="empty">Завантаження…</p>':U.err?errView():U.tab==='req'?(isA||ME.name?reqView():whoView()):supView();
  if(id){const el=document.getElementById(id);if(el&&el!==a&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function setupView(){return `<div class="card"><h1>Потрібне налаштування</h1><p>Відкрийте <code>index.html</code> і вставте вгорі скрипта <code>SUPABASE_URL</code> та <code>SUPABASE_ANON_KEY</code> (Supabase → Project Settings → API).</p></div>`}
function errView(){return `<div class="card"><h1>Не вдалося завантажити дані</h1><p class="err">${esc(U.err)}</p><p>Перевірте, що SQL-скрипт <code>setup.sql</code> виконано в Supabase і ключі в <code>index.html</code> правильні.</p><button class="btn pri" id="retry">Спробувати ще раз</button></div>`}
const deptList=`<datalist id="depts">${DEPTS.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`;
function whoView(){return `<form class="card" id="whof"><h1>Хто ви?</h1><p class="sub">Ім'я потрібне, щоб підписати заявки й показувати вам ваші. Пишіть його щоразу однаково.</p>
  <label class="f">Ім'я та прізвище *<input id="w-n" autocomplete="name"></label>
  <label class="f">Відділ / локація<input id="w-d" list="depts" placeholder="Напр.: Склад, ІТО, Локація Поділ"></label>${deptList}
  <p class="err" id="w-err"></p><div class="acts"><button class="btn pri">Далі</button></div></form>`}

function reqView(){
  const a=isA,base=scoped();
  const list=U.status==='all'?base:base.filter(r=>r.status===U.status);
  const cnt=k=>base.filter(r=>r.status===k).length;
  const side=a?`<aside class="side">
    <h3>Групи</h3>
    <button class="g ${U.group==='all'?'on':''}" data-g="all">Усі заявки <span>${D.requests.length}</span></button>
    <button class="g ${U.group==='none'?'on':''}" data-g="none" data-drop="none">Без групи <span>${D.requests.filter(r=>!r.group_id).length}</span></button>
    ${D.groups.map(g=>`<div class="g folder ${U.group===g.id?'on':''}" data-g="${g.id}" data-drop="${g.id}" role="button" tabindex="0">${esc(g.name)}<span>${D.requests.filter(r=>r.group_id===g.id).length}</span><button class="x" data-delg="${g.id}" title="Видалити групу" aria-label="Видалити групу">×</button></div>`).join('')}
    <form class="ng" id="ngf"><input id="ngn" placeholder="Нова група" aria-label="Назва нової групи"><button class="btn sm pri">+</button></form>
    <p class="hint">Перетягніть заявку (або кілька вибраних) на групу.</p>
  </aside>`:'';
  const title=a?(U.group==='all'?'Усі заявки':U.group==='none'?'Без групи':grp(U.group)?.name||''):'Мої заявки';
  const open=base.filter(r=>r.status!=='got').length;
  const head=a?['','Позиція','К-сть','Хто','Група','Постачальник','Статус','Рахунок · доставка','Дата']:['Позиція','К-сть','Постачальник','Статус','Доставка','Дата'];
  const cols=head.length;
  let body='';
  if(!list.length)body=`<tr><td colspan="${cols}" class="empty">${U.q||U.status!=='all'||U.supF?'Нічого не знайдено за цим фільтром.':'Заявок ще немає. Натисніть «Нова заявка».'}</td></tr>`;
  else if(U.by==='none')body=list.map(row).join('');
  else{
    const key={sup:r=>r.sup_id||'',status:r=>r.status,author:r=>norm(r.author_name)}[U.by];
    const keys=[...new Set(list.map(key))];
    const label=k=>U.by==='sup'?(sup(k)?.name||'Постачальника не вказано'):U.by==='status'?stT(k):(list.find(r=>key(r)===k)?.author_name||'');
    if(U.by==='status')keys.sort((x,y)=>ST.findIndex(s=>s.k===x)-ST.findIndex(s=>s.k===y));
    else keys.sort((x,y)=>list.filter(r=>key(r)===y).length-list.filter(r=>key(r)===x).length);
    body=keys.map(k=>{const rs=list.filter(r=>key(r)===k);const nw=rs.filter(r=>r.status==='new').length;
      return `<tr class="sec"><td colspan="${cols}">${esc(label(k))} · ${rs.length}${a&&U.by==='sup'&&k&&nw?`<button class="btn sm pri" data-orderall="${k}">Замовити ${nw} нових → «Очікую рахунок»</button>`:''}</td></tr>`+rs.map(row).join('')}).join('');
  }
  const supFilter=U.supF?`<button class="chip on" data-clrsup>Постачальник: ${esc(sup(U.supF)?.name)} ×</button>`:'';
  return `<div class="wrap ${a?'':'solo'}">${side}<main>
    <h1>${esc(title)}</h1>
    <p class="sub">${base.length} заявок, у роботі ${open}${a?'':'. Тут видно статус і чим їде ваше замовлення.'}</p>
    <div class="bar">
      <input type="search" id="q" placeholder="Пошук: назва, автор, рахунок, ТТН…" value="${esc(U.q)}" aria-label="Пошук">
      <select id="by" aria-label="Групувати">${opts([['none','Без групування'],['sup','За постачальником'],['status','За статусом'],...(a?[['author','За автором']]:[])],U.by)}</select>
      <button class="btn pri" data-new>+ Нова заявка</button>
    </div>
    <div class="chips">${supFilter}<button class="chip ${U.status==='all'?'on':''}" data-st="all">Усі <b>${base.length}</b></button>${ST.map(s=>`<button class="chip ${U.status===s.k?'on':''}" data-st="${s.k}" style="--c:var(--c-${s.k})"><i></i>${s.t} <b>${cnt(s.k)}</b></button>`).join('')}</div>
    ${a&&U.sel.size?bulk():''}
    <table class="stack"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
  </main></div>`;
}
function bulk(){
  return `<div class="bulk"><b>Вибрано ${U.sel.size}</b>
  <select id="bst" aria-label="Статус для вибраних"><option value="">Статус…</option>${opts(ST.map(s=>[s.k,s.t]))}</select>
  <select id="bgr" aria-label="Група для вибраних"><option value="">У групу…</option><option value="__none">Прибрати з групи</option>${opts(D.groups.map(g=>[g.id,g.name]))}</select>
  <select id="bsp" aria-label="Постачальник для вибраних"><option value="">Постачальник…</option>${opts(D.suppliers.map(s=>[s.id,s.name]))}</select>
  <button class="btn sm" data-clrsel>Зняти вибір</button></div>`;
}
function row(r){
  const s=sup(r.sup_id),g=grp(r.group_id),sel=U.sel.has(r.id);
  const pos=`<td class="nm"><b>${esc(r.title)}</b>${r.urgent?'<span class="urg">терміново</span>':''}<a class="lnk" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(host(r.url)||r.url)} ↗</a>${r.note?`<small>${esc(r.note)}</small>`:''}</td>`;
  const qty=`<td class="num">${esc(r.qty)} ${esc(r.unit)}</td>`;
  const ship=r.car?`${esc(r.car)}${r.ttn?`, ТТН ${esc(r.ttn)}`:''}`:'';
  if(!isA)return `<tr data-id="${r.id}">${pos}${qty}<td>${esc(s?.name||'')}</td><td><span class="st s-${r.status}">${stT(r.status)}</span></td><td>${ship}</td><td class="num">${dt(r.created_at)}</td></tr>`;
  const docs=[r.inv&&`Рах. ${esc(r.inv)}`,r.amount&&money(r.amount),r.vn&&`ВН ${esc(r.vn)}`].filter(Boolean).join(' · ');
  return `<tr data-id="${r.id}" draggable="true" class="${sel?'sel':''}">
    <td class="ck"><input type="checkbox" data-ck="${r.id}" ${sel?'checked':''} aria-label="Вибрати"></td>${pos}${qty}
    <td>${esc(r.author_name)}<small>${esc(r.author_dept)}</small></td>
    <td>${g?`<span class="gp">${esc(g.name)}</span>`:''}</td>
    <td>${esc(s?.name||'')}</td>
    <td><select class="st s-${r.status}" data-rst="${r.id}" aria-label="Статус">${opts(ST.map(x=>[x.k,x.t]),r.status)}</select></td>
    <td>${docs?`<small style="color:var(--ink)">${docs}</small>`:''}${ship?`<small>${ship}</small>`:''}</td>
    <td class="num">${dt(r.created_at)}</td></tr>`;
}

function supView(){
  const a=isA;
  const openOf=id=>D.requests.filter(r=>r.sup_id===id&&r.status==='new');
  let list=D.suppliers.slice().sort((x,y)=>(a?openOf(y.id).length-openOf(x.id).length:0)||x.name.localeCompare(y.name,'uk'));
  if(U.sq){const s=U.sq.toLowerCase();list=list.filter(x=>(x.name+' '+(x.site||'')+' '+D.positions.filter(p=>p.sup_id===x.id).map(p=>p.title).join(' ')).toLowerCase().includes(s))}
  if(!U.sup||!sup(U.sup))U.sup=list[0]?.id||null;
  const s=sup(U.sup);
  const left=`<aside class="sl"><input type="search" id="sq" placeholder="Пошук постачальника або товару" value="${esc(U.sq)}" aria-label="Пошук постачальника">
    ${list.map(x=>{const n=a?openOf(x.id).length:0;return `<button class="si ${x.id===U.sup?'on':''}" data-sup="${x.id}"><b>${esc(x.name)}</b>${n?`<em title="Чекають замовлення">${n}</em>`:''}<small>${D.positions.filter(p=>p.sup_id===x.id).length} позицій${x.site?' · '+esc(x.site):''}</small></button>`}).join('')||'<p class="hint">Постачальників ще немає.</p>'}
    ${a?`<form class="ng" id="nsf"><input id="nsn" placeholder="Новий постачальник" aria-label="Назва постачальника"><button class="btn sm pri">+</button></form>`:''}
  </aside>`;
  if(!s)return `<div class="sups">${left}<main><p class="empty">${a?'Додайте першого постачальника ліворуч.':'Каталог поки порожній.'}</p></main></div>`;
  const pos=D.positions.filter(p=>p.sup_id===s.id);
  const times=p=>D.requests.filter(r=>r.url===p.url&&r.status!=='new').length;
  const wait=openOf(s.id);
  const rs=D.requests.filter(r=>r.sup_id===s.id);
  const spent=rs.filter(r=>['paid','got'].includes(r.status)).reduce((t,r)=>t+(+r.amount||0),0);
  return `<div class="sups">${left}<main>
    <h1>${esc(s.name)}</h1>
    <p class="sub">${s.site?`<a class="lnk" style="display:inline" href="https://${esc(s.site)}" target="_blank" rel="noopener">${esc(s.site)} ↗</a>`:''}</p>
    ${a?`<div class="kpis"><div class="kpi"><b>${wait.length}</b>чекають замовлення</div><div class="kpi"><b>${rs.filter(r=>['invoice','pay','paid'].includes(r.status)).length}</b>у процесі</div><div class="kpi"><b>${rs.filter(r=>r.status==='got').length}</b>отримано</div><div class="kpi"><b>${money(spent)||'0 грн'}</b>оплачено всього</div></div>
    ${wait.length?`<div class="wait"><h3>Чекають замовлення: ${wait.length}</h3><ul>${wait.map(r=>`<li>${esc(r.title)}, ${esc(r.qty)} ${esc(r.unit)} <small style="color:var(--mute)">(${esc(r.author_name)})</small></li>`).join('')}</ul>
      <div class="acts" style="margin:0"><button class="btn pri" data-orderall="${s.id}">Замовити все → «Очікую рахунок»</button><button class="btn" data-showsup="${s.id}">Відкрити в заявках</button></div></div>`:''}
    <fieldset class="box"><legend>Дані постачальника</legend><div class="meta">
      <label class="f">Назва<input data-sf="name" value="${esc(s.name)}"></label>
      <label class="f">Сайт (домен)<input data-sf="site" value="${esc(s.site)}" placeholder="example.com.ua"></label>
      <label class="f">Контакти<input data-sf="contact" value="${esc(s.contact)}"></label>
      <label class="f">ЄДРПОУ<input data-sf="edrpou" value="${esc(s.edrpou)}" inputmode="numeric"></label></div>
      <label class="f">Нотатки<textarea data-sf="note">${esc(s.note)}</textarea></label></fieldset>`:''}
    <h2 style="margin:22px 0 8px;font-size:20px">Позиції, які замовляли (${pos.length})</h2>
    <table class="stack"><thead><tr><th>Позиція</th><th>Од.</th><th class="num">Остання ціна</th>${a?'<th class="num">Замовляли</th>':''}<th></th></tr></thead><tbody>
    ${pos.map(p=>`<tr><td class="nm"><b>${esc(p.title)}</b><a class="lnk" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(host(p.url))} ↗</a></td><td>${esc(p.unit)}</td><td class="num">${money(p.price)||'—'}</td>${a?`<td class="num">${times(p)} раз</td>`:''}<td><button class="btn sm" data-reqpos="${p.id}">Замовити</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">Позиції з'являться тут автоматично, щойно заявку з цим постачальником візьмуть у роботу.</td></tr>`}
    </tbody></table>
    ${a?`<form id="npf" class="box"><legend>Додати позицію вручну</legend><div class="two"><label class="f">Назва<input id="np-t"></label><label class="f">Посилання<input id="np-u" type="url" placeholder="https://"></label></div><div class="two"><label class="f">Од.<select id="np-un">${opts(UNITS.map(x=>[x,x]),'шт')}</select></label><label class="f">Ціна, грн<input id="np-p" type="number" step="0.01" min="0"></label></div><div class="acts"><button class="btn">Додати</button></div></form>`:''}
  </main></div>`;
}

function catalogSearch(s){

  const res=s?D.positions.filter(p=>(p.title+' '+p.url+' '+(sup(p.sup_id)?.name||'')).toLowerCase().includes(s)).slice(0,8):[];
  $('#cres').innerHTML=res.map(p=>`<button type="button" data-pick="${p.id}"><b>${esc(p.title)}</b><br><small>${esc(sup(p.sup_id)?.name||'')} · ${money(p.price)||'ціна невідома'} за ${esc(p.unit)}</small></button>`).join('')||(s?'<small style="color:var(--mute)">У каталозі немає. Заповніть поля нижче вручну.</small>':'');
}

function loginBox(){
  M={kind:'login'};
  $('#ov').innerHTML=`<div class="ovl center" data-close><form class="panel" id="lgf"><h2>Вхід для закупівель</h2>
    <label class="f">Email<input id="l-e" type="email" autocomplete="username"></label>
    <label class="f">Пароль<input id="l-p" type="password" autocomplete="current-password"></label>
    <p class="err" id="l-err"></p><div class="acts"><button class="btn pri" id="l-go">Увійти</button><button type="button" class="btn" data-x>Скасувати</button></div></form></div>`;
  $('#l-e').focus();
}
const val=id=>document.getElementById(id)?.value.trim()??'';
function validate(t,u,qn,errEl,who){
  const e=who===''?"Вкажіть своє ім'я.":!t?'Вкажіть назву.':!/^https?:\/\/\S+\.\S+/.test(u)?'Вкажіть посилання, що починається з https://':!(qn>0)?'Вкажіть кількість, більшу за 0.':'';
  $(errEl).textContent=e;return !e;
}

/* ---------- події ---------- */
document.addEventListener('click',e=>{
  const t=e.target,c=s=>t.closest(s);
  let el;
  if(el=c('[data-tab]')){U.tab=el.dataset.tab;U.sel.clear();render();return}
  if(c('[data-x]')){closeOv();return}
  if(t.matches('[data-close]')){closeOv();return}
  if(c('#retry')||c('#reload')){U.loading=!D.requests.length;render();loadAll();return}
  if(c('[data-login]')){loginBox();return}
  if(c('[data-logout]')){sb.auth.signOut().then(()=>{isA=false;email='';U.sel.clear();U.group='all';loadAll()});return}
  if(c('[data-setme]')){ME={name:'',dept:''};saveMe();U.tab='req';render();return}
  if(el=c('[data-delg]')){e.stopPropagation();const id=el.dataset.delg;if(U.group===id)U.group='all';act(()=>q(sb.from(T.grp).delete().eq('id',id)),'Групу видалено, заявки залишились');return}
  if(el=c('[data-g]')){U.group=el.dataset.g;U.sel.clear();render();return}
  if(el=c('[data-st]')){U.status=el.dataset.st;render();return}
  if(c('[data-clrsup]')){U.supF=null;render();return}
  if(c('[data-clrsel]')){U.sel.clear();render();return}
  if(c('[data-new]')){newReq();return}
  if(el=c('[data-orderall]')){const id=el.dataset.orderall;el.disabled=true;act(async()=>{const n=await setStatus(D.requests.filter(r=>r.sup_id===id&&r.status==='new'),'invoice');toast(`${n} заявок → «Очікую рахунок»`)});return}
  if(el=c('[data-showsup]')){U.tab='req';U.supF=el.dataset.showsup;U.group='all';U.status='all';render();return}
  if(el=c('[data-sup]')){U.sup=el.dataset.sup;render();return}
  if(el=c('[data-reqpos]')){const p=D.positions.find(x=>x.id===el.dataset.reqpos);newReq({title:p.title,url:p.url,sup:p.sup_id,unit:p.unit});return}
  if(el=c('[data-pick]')){const p=D.positions.find(x=>x.id===el.dataset.pick);$('#f-t').value=p.title;$('#f-u').value=p.url;$('#f-un').value=p.unit;M.sup=p.sup_id;$('#pk').textContent='Постачальник: '+(sup(p.sup_id)?.name||'');$('#cres').innerHTML='';$('#f-q').focus();return}
  if(el=c('[data-del]')){if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Точно видалити?';return}const id=el.dataset.del;U.sel.delete(id);closeOv();act(()=>q(sb.from(T.req).delete().eq('id',id)),'Заявку видалено');return}
  if(t.matches('[data-ck],select,input,a')||c('a'))return;
  if(el=c('tr[data-id]')){openReq(el.dataset.id)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&M)closeOv();
  if(e.key==='Enter'&&e.target.matches('.g[data-g]')){U.group=e.target.dataset.g;render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='by'){U.by=t.value;render();return}
  if(t.dataset.ck){t.checked?U.sel.add(t.dataset.ck):U.sel.delete(t.dataset.ck);render();return}
  if(t.dataset.rst){const r=D.requests.find(x=>x.id===t.dataset.rst);const k=t.value;act(()=>setStatus([r],k),`«${r.title}» → ${stT(k)}`);return}
  if(['bst','bgr','bsp'].includes(t.id)&&t.value){
    const rs=D.requests.filter(r=>U.sel.has(r.id)),ids=rs.map(r=>r.id),v=t.value,kind=t.id;
    U.sel.clear();
    act(async()=>{
      if(kind==='bst')await setStatus(rs,v);
      if(kind==='bgr')await q(sb.from(T.req).update({group_id:v==='__none'?null:v}).in('id',ids));
      if(kind==='bsp'){await q(sb.from(T.req).update({sup_id:v}).in('id',ids));await Promise.all(rs.filter(r=>r.status!=='new').map(r=>upsertPos({...r,sup_id:v})))}
    },`Оновлено заявок: ${rs.length}`);return}
  if(t.dataset.sf){let v=t.value.trim();if(t.dataset.sf==='site')v=v.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');const id=U.sup;act(()=>q(sb.from(T.sup).update({[t.dataset.sf]:v}).eq('id',id)),'Збережено')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){U.q=t.value;render()}
  if(t.id==='sq'){U.sq=t.value;render()}
  if(t.id==='cq')catalogSearch(t.value);
  if(t.id==='f-u'&&M&&M.kind==='new'){M.sup=guessSup(t.value);$('#pk').textContent=M.sup?'Постачальник визначено за посиланням: '+sup(M.sup).name:''}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='whof'){const n=val('w-n');if(!n){$('#w-err').textContent="Вкажіть ім'я.";return}ME={name:n,dept:val('w-d')};saveMe();render();return}
  if(f.id==='lgf'){
    $('#l-go').disabled=true;$('#l-err').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:val('l-e'),password:$('#l-p').value});
    if(error){$('#l-err').textContent='Невірний email або пароль.';$('#l-go').disabled=false;return}
    await checkAdmin();
    if(!isA){$('#l-err').textContent='Цей акаунт не має доступу адміністратора.';$('#l-go').disabled=false;return}
    closeOv();U.loading=true;render();loadAll();return}
  if(f.id==='ngf'){const n=val('ngn');if(!n)return;act(async()=>{const g=await q(sb.from(T.grp).insert({name:n}).select().single());U.group=g.id},'Групу створено');return}
  if(f.id==='nsf'){const n=val('nsn');if(!n)return;act(async()=>{const s=await q(sb.from(T.sup).insert({name:n}).select().single());U.sup=s.id;U.sq=''});return}
  if(f.id==='npf'){const t=val('np-t'),u=val('np-u');if(!t||!/^https?:\/\//.test(u)){toast('Вкажіть назву і посилання з https://');return}const row={sup_id:U.sup,title:t,url:u,unit:val('np-un')};if(val('np-p'))row.price=+val('np-p');act(()=>q(sb.from(T.pos).upsert(row,{onConflict:'url'})),'Позицію додано');return}
  if(f.id==='nrf'){
    const who=val('f-who'),t=val('f-t'),u=val('f-u'),qn=+val('f-q');
    if(!validate(t,u,qn,'#f-err',who))return;
    ME={name:who,dept:val('f-dept')};saveMe();
    const row={title:t,url:u,qty:qn,unit:val('f-un'),author_name:who,author_dept:ME.dept,note:val('f-n'),urgent:$('#f-urg').checked,sup_id:M.sup||guessSup(u)};
    if(isA)row.group_id=val('f-g')||null;
    $('#f-go').disabled=true;
    try{await q(sb.from(T.req).insert(row))}catch(err){$('#f-err').textContent='Не вдалося зберегти: '+(err.message||err);$('#f-go').disabled=false;return}
    closeOv();U.tab='req';U.status='all';toast('Заявку створено');loadAll();return}
  if(f.id==='erf'){
    const r=D.requests.find(x=>x.id===M.id);
    const t=val('e-t'),u=val('e-u'),qn=+val('e-q');
    if(!validate(t,u,qn,'#e-err'))return;
    const patch={title:t,url:u,qty:qn,unit:val('e-un'),note:val('e-n'),group_id:val('e-g')||null,sup_id:val('e-sp')||null,inv:val('e-inv'),amount:val('e-am')?+val('e-am'):null,vn:val('e-vn'),car:val('e-car'),ttn:val('e-ttn'),adm:val('e-adm')};
    const k=val('e-s');if(k!==r.status)Object.assign(patch,statusPatch(r,k));
    closeOv();
    act(async()=>{await q(sb.from(T.req).update(patch).eq('id',r.id));const n={...r,...patch};if(n.status!=='new'&&n.sup_id)await upsertPos(n)},'Збережено')}
});
/* перетягування заявок у групи */
let drag=[];
document.addEventListener('dragstart',e=>{const tr=e.target.closest&&e.target.closest('tr[data-id]');if(!tr)return;const id=tr.dataset.id;drag=U.sel.has(id)?[...U.sel]:[id];e.dataTransfer.setData('text/plain',drag.join(','));e.dataTransfer.effectAllowed='move';tr.classList.add('dragging')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));setTimeout(()=>drag=[],0)});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d||!drag.length)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==d&&x.classList.remove('over'));d.classList.add('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d||!drag.length)return;e.preventDefault();const g=d.dataset.drop==='none'?null:d.dataset.drop;const ids=drag.slice(),n=ids.length;drag=[];U.sel.clear();
  D.requests.forEach(r=>{if(ids.includes(r.id))r.group_id=g});render();
  act(()=>q(sb.from(T.req).update({group_id:g}).in('id',ids)),g?`Переміщено в «${grp(g)?.name}»: ${n}`:`Прибрано з групи: ${n}`)});

/* ---------- старт ---------- */
(async()=>{
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase){U.loading=false;render();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  render();
  try{await checkAdmin()}catch(e){}
  await loadAll();
  setInterval(()=>{if(!document.hidden&&!M&&!drag.length)loadAll()},30000);
})();
}
</script>
</body>
</html>
