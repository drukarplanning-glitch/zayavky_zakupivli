<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявки на закупівлю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тихий робочий інструмент, як аркуш обліку на складі
   IDEA: накладна / журнал заявок — рядки, штампи статусів, папки-групи
   PICTURE: сам журнал заявок одразу під заголовком
   COLOUR and TYPE: білий, смарагдовий #00a86b, блідо-рожевий для груп; Schibsted Grotesk
   LAYOUT: шапка з вкладками, ліворуч групи (цілі для перетягування), праворуч журнал */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1410);--ink:light-dark(#111614,#e7eee9);--mute:light-dark(#5d6762,#9aa8a1);
--line:light-dark(#e4e8e6,#22302a);--soft:light-dark(#f4f7f5,#121d18);--acc:light-dark(#00a86b,#2fd093);
--accInk:light-dark(#ffffff,#04140d);--pink:light-dark(#ffd6e0,#4a2530);--pinkInk:light-dark(#6b1f33,#ffd6e0);
--c-new:light-dark(#5f6b66,#a7b3ad);--c-invoice:light-dark(#a15c00,#f0b45b);--c-pay:light-dark(#1d5bd6,#7aa7ff);
--c-paid:light-dark(#6d32d9,#b99bff);--c-got:light-dark(#00804f,#2fd093)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px max(3vw,16px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--acc);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px 6px;border:2px solid var(--accInk);border-top:0;border-radius:0 0 3px 3px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:10px 14px;border-radius:8px;font-weight:600;color:var(--mute);min-height:44px}
.tab[aria-current=true]{background:var(--soft);color:var(--ink)}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.who select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px;font-size:15px}
.demo{font-size:13px;color:var(--mute);padding:8px max(3vw,16px);background:var(--soft);border-bottom:1px solid var(--line)}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;min-height:calc(100vh - 110px)}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
.side{border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side h3{font-size:13px;color:var(--mute);margin:0 8px 6px;font-weight:600}
.g{display:flex;align-items:center;gap:8px;width:100%;text-align:start;border:1px dashed transparent;background:none;padding:9px 10px;border-radius:8px;min-height:42px}
.g span{margin-inline-start:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.g.on{background:var(--soft);font-weight:700}
.g.folder::before{content:"";width:14px;height:11px;border-radius:2px;background:var(--pink);flex:none;box-shadow:inset 0 3px 0 color-mix(in srgb,var(--pinkInk) 25%,transparent)}
.g.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;margin-inline:2px}
.cp{display:inline-block;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--ink);border-radius:5px;padding:1px 7px;font-size:13px;white-space:nowrap}
.g.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.g .x{opacity:0;border:0;background:none;color:var(--mute);padding:0 4px;font-size:16px}
.g:hover .x,.g:focus-within .x{opacity:1}
.ng{display:flex;gap:6px;margin-top:10px}
.ng input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px}
.hint{font-size:13px;color:var(--mute);margin:10px 8px 0}
main{padding:20px max(2.5vw,16px) 60px}
h1{font-size:32px;line-height:1.05;margin:0 0 4px;font-weight:800;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.bar select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.btn{border:1px solid var(--line);background:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;min-height:44px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn.warn{color:#c2253d}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px;min-height:36px;display:flex;gap:6px;align-items:center}
.chip b{font-variant-numeric:tabular-nums;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--pink);color:var(--pinkInk);margin-bottom:12px;font-size:15px}
.bulk select{padding:6px 8px;border-radius:6px;border:0;background:var(--bg);color:var(--ink);min-height:36px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mute);font-weight:600;text-align:start;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr[data-id]{cursor:pointer}
tr[data-id]:hover td{background:var(--soft)}
tr.sel td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
tr.dragging{opacity:.4}
td small{display:block;color:var(--mute);font-size:13px}
.nm b{font-weight:600}
.lnk{display:block;font-size:13px;color:var(--acc);text-decoration:none;overflow-wrap:anywhere}
.lnk:hover{text-decoration:underline}
.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.urg{display:inline-block;margin-inline-start:6px;font-size:12px;color:#c2253d;border:1px solid currentColor;border-radius:4px;padding:0 5px;vertical-align:2px}
.gp{display:inline-block;background:var(--pink);color:var(--pinkInk);border-radius:5px;padding:1px 7px;font-size:13px;white-space:nowrap}
.st{--c:var(--c-new);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:6px;padding:4px 8px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-block}
select.st{min-height:36px;padding-inline-end:4px}
.s-invoice{--c:var(--c-invoice)}.s-pay{--c:var(--c-pay)}.s-paid{--c:var(--c-paid)}.s-got{--c:var(--c-got)}
.ck{width:36px}.ck input{width:20px;height:20px;accent-color:var(--acc)}
tr.sec td{background:var(--soft);font-weight:700;padding:10px 8px;cursor:default}
tr.sec .btn{margin-inline-start:10px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.ovl{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:20;display:flex;justify-content:flex-end}
.ovl.center{justify-content:center;align-items:flex-start;padding:5vh 12px;overflow:auto}
.panel{background:var(--bg);width:min(480px,100%);height:100%;overflow:auto;padding:22px;border-inline-start:1px solid var(--line)}
.center .panel{height:auto;border-radius:14px;border:1px solid var(--line)}
.panel h2{font-size:22px;margin:0 0 4px;line-height:1.2}
.f{display:block;margin:12px 0 0;font-size:14px;color:var(--mute)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.box{border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px;margin-top:16px}
.box legend{font-weight:700;padding:0 6px;font-size:14px}
.err{color:#c2253d;font-size:14px;min-height:20px;margin:8px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hist{font-size:14px;color:var(--mute);margin:14px 0 0;padding-inline-start:18px}
.cres{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:210px;overflow:auto}
.cres button{text-align:start;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px}
.cres small{color:var(--mute)}
.picked{font-size:14px;margin-top:6px;color:var(--acc)}
.sups{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 110px)}
.sl{border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:var(--hh,72px);height:calc(100vh - var(--hh,72px));align-self:start}
.sl .ng{margin:0 0 10px}.sl .ng input{margin:0}
.sl>input{width:100%}
.sll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-inline:-4px;padding-inline:4px}
.sl input{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px;min-height:44px}
.si{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:start;border:0;background:none;padding:10px;border-radius:8px}
.si.on{background:var(--soft)}
.si b{font-weight:600}.si small{color:var(--mute);font-size:13px;grid-column:1}
.si em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;background:var(--acc);color:var(--accInk);font-weight:700;border-radius:99px;padding:2px 9px;font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.wait{background:color-mix(in srgb,var(--acc) 9%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:12px;padding:14px;margin:12px 0 18px}
.wait h3{margin:0 0 8px;font-size:17px}
.wait ul{margin:0 0 12px;padding-inline-start:18px;font-size:15px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--accInk);font-size:30px;line-height:1;border:0;box-shadow:0 6px 18px rgb(0 0 0/.25);z-index:6;align-items:center;justify-content:center}
.mgr{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:7px;font-weight:600;color:var(--mute);min-height:38px}
.seg button.on{background:var(--ink);color:var(--bg)}
.cd.pay b{font-size:15px}
.okp{color:var(--c-got)!important}.duep{color:var(--c-invoice)!important;font-weight:600}
.due{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:color-mix(in srgb,var(--c-invoice) 12%,var(--bg));border:1px solid color-mix(in srgb,var(--c-invoice) 40%,transparent);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.due>div{flex:1 1 260px}.due small{display:block;color:var(--mute);font-size:13px}
.dup small{color:var(--c-invoice);font-size:13px;display:block;margin-top:6px}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}.tpl.on{border-color:var(--acc)}
.tplh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}.tplh small{display:block;color:var(--mute);font-size:13px}
.kq{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-size:15px}
.mini{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}.mini input,.mini select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:36px;font-size:14px;max-width:180px}
.mini input[type=number]{width:80px}.chkl{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}.chkl input{width:18px;height:18px;min-height:0;accent-color:var(--acc)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:4px 32px}
.bar2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.bar2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar2 i{display:block;height:10px;border-radius:5px;background:var(--acc)}.bar2 b{font-variant-numeric:tabular-nums;white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.calwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calnav b{min-width:150px;text-align:center;font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{font-size:13px;color:var(--mute);text-align:center;padding:2px 0}
.cd{min-height:64px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--acc) var(--h),var(--bg));padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;color:var(--ink)}
.cd .dn{font-size:13px;color:var(--mute)}.cd b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}.cd small{font-size:12px;color:var(--c-got)}
.cd.out{opacity:.4}.cd.today{border:2px solid var(--ink)}.cd.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 55%,transparent)}
.cd.late{background:color-mix(in srgb,#e0314f var(--h),var(--bg));border-color:#e0314f}
.ch{font-size:19px;margin:22px 0 10px;text-transform:none}.calwrap .ch{margin-top:0}
.ch::first-letter{text-transform:uppercase}
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cr.lt{border-color:color-mix(in srgb,#e0314f 55%,transparent)}
.crm{flex:1 1 220px}.crm small{display:block;color:var(--mute);font-size:13px}
.cr input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:36px}
@media(max-width:900px){.calwrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.cd{min-height:48px;padding:4px}.cd b{font-size:16px}.calnav b{min-width:0;flex:1}}
.rpl{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:52vh;overflow:auto}
.rpi{display:grid;grid-template-columns:auto minmax(0,1fr) 90px auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rpi input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.rpi small{display:block;color:var(--mute);font-size:13px}
.rpi .rp-q{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;width:100%;text-align:right}
.rpi em{font-style:normal;color:var(--mute);font-size:14px;min-width:3em}
.item{border:1px solid var(--line);border-radius:12px;padding:2px 14px 14px;margin-top:14px}
.ihead{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:34px}
.aggh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-weight:400}
.aggh small{color:var(--mute);flex-basis:100%;font-size:13px}
.tot{color:var(--acc)}
.late{color:#c2253d!important;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:30;transition:opacity .2s}
.card{max-width:560px;margin:32px auto;padding:24px;border:1px solid var(--line);border-radius:14px}
code{background:var(--soft);padding:1px 5px;border-radius:4px}
footer{padding:16px max(3vw,16px);font-size:13px;color:var(--mute);border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:820px){
 .wrap,.sups{grid-template-columns:minmax(0,1fr);min-height:0}
 .side,.sl{border-inline-end:0;border-bottom:1px solid var(--line);padding:12px 16px;display:block}
 .side h3{margin:8px 0 6px}
 .gl,.sll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
 .gl .g{flex:none;width:auto;border:1px solid var(--line);border-radius:99px;min-height:40px;padding:6px 12px}
 .gl .g .x{opacity:1}
 .sll .si{flex:none;max-width:240px;border:1px solid var(--line)}
 .sl{position:static;height:auto}.sll{flex-direction:row;overflow-y:hidden;margin:0;padding-inline:0}
 .side .hint{display:none}
 .mgr{display:inline-flex;margin-top:10px}
 .side:not(.edit) .ng{display:none}
 .ng{margin:8px 0 4px}
}
@media(max-width:600px){
 header{padding:10px 14px;gap:6px 10px}
 .logo{font-size:18px}
 .tabs{order:3;width:100%;overflow-x:auto;scrollbar-width:none}.tab{flex:1 0 auto;padding:10px 8px;font-size:15px}
 .who{width:auto;margin-inline-start:auto;font-size:13px;line-height:1.3}.who .em,.who .lg{display:none}.who .btn{flex:none}
 main{padding:16px 14px 96px}
 h1{font-size:26px}
 .bar input[type=search]{flex:1 1 100%}.bar select{flex:1}.bar [data-new]{display:none}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-14px;padding-inline:14px}.chip{flex:none}
 .fab{display:flex}
 .bulk{position:sticky;bottom:8px;z-index:4;box-shadow:0 6px 18px rgb(0 0 0/.18)}.bulk select,.bulk input{flex:1 1 45%}
 table{font-size:14px}
 .stack thead{display:none}
 .stack tbody{display:flex;flex-direction:column;gap:10px}
 .stack tr{display:grid;position:relative;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
 .stack tr.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent)}
 .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start;background:none!important}
 .stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;white-space:normal;color:var(--mute);font-size:13px}
 .stack td:empty{display:none}
 .stack td.nm{padding-inline:0 40px;font-size:16px}
 .stack td.nm::before,.stack td.ck::before,.stack td.empty::before,.stack tr.sec td::before{display:none}
 .stack td.ck{position:absolute;top:10px;right:10px;padding:0;width:auto}
 .stack td.empty{padding:30px 0;text-align:center}
 .stack td.num{text-align:start}
 .stack tr.sec{border:0;padding:8px 0 0;border-radius:0}
 .stack tr.sec td{padding:0}
 .ovl.center{padding:0;align-items:stretch}
 .panel{padding:16px;width:100%}
 .center .panel{border-radius:0;border:0;min-height:100%}
 .panel .acts{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:12px;border-top:1px solid var(--line)}
 .kpi{flex:1 1 40%}
}
</style>

function upsertPos(r){

  }
  const row={sup_id:r.sup_id,title:r.title,url:r.url,unit:r.unit};
  if(r.amount&&r.qty)row.price=Math.round(r.amount/r.qty*100)/100;
  return q(sb.from(T.pos).upsert(row,{onConflict:'url'}));
}

  if(t.dataset.eta!==undefined&&t.type==='date'){const id=t.dataset.eta,v=t.value||null;act(()=>q(sb.from(T.req).update({eta:v}).eq('id',id)),v?'Дату очікування змінено':'Дату прибрано');return}
  if(t.classList.contains('it-un')){dupHint(t.closest('.item'));return}
  if(t.dataset.kname){const v=t.value.trim();if(!v)return;act(()=>q(sb.from(T.kit).update({name:v}).eq('id',t.dataset.kname)),'Назву змінено');return}
  if(t.dataset.kiq){const v=+t.value;if(!(v>0)){toast('Кількість має бути більшою за 0');return}act(()=>q(sb.from(T.kitI).update({qty:v}).eq('id',t.dataset.kiq)),'Кількість у шаблоні змінено');return}
  if(t.dataset.schf){const f=t.dataset.schf,id=t.dataset.sid;let v=f==='active'?t.checked:t.value;if(f==='every_days'){v=Math.round(+v);if(!(v>=1&&v<=365)){toast('Вкажіть від 1 до 365 днів');return}}if(f==='next_date'&&!v){toast('Вкажіть дату');return}if(['kit_id','category_id'].includes(f))v=v||null;act(()=>q(sb.from(T.sch).update({[f]:v}).eq('id',id)),'Збережено');return}
  if(t.dataset.psup){const id=t.dataset.psup,v=t.value||null;act(()=>q(sb.from(T.pos).update({sup_id:v}).eq('id',id)),'Постачальника позиції змінено');return}
  if(t.dataset.rst){const r=D.requests.find(x=>x.id===t.dataset.rst);const k=t.value;act(()=>setStatus([r],k),`«${r.title}» → ${stT(k)}`);return}
  if(t.id==='bpay'&&t.value){const ids=[...U.sel],v=t.value;U.sel.clear();act(()=>q(sb.from(T.req).update(v==='paidnow'?{paid_on:today()}:{pay_terms:v.slice(2)||null}).in('id',ids)),`Оновлено заявок: ${ids.length}`);return}
  if(['bst','bgr','bsp','bct','bet'].includes(t.id)&&t.value){
    const rs=D.requests.filter(r=>U.sel.has(r.id)),ids=rs.map(r=>r.id),v=t.value,kind=t.id;
    U.sel.clear();
    act(async()=>{
      if(kind==='bst')await setStatus(rs,v);
      if(kind==='bet')await q(sb.from(T.req).update({eta:v}).in('id',ids));
      if(kind==='bct')await q(sb.from(T.req).update({category_id:v==='__none'?null:v}).in('id',ids));
      if(kind==='bgr')await q(sb.from(T.req).update({group_id:v==='__none'?null:v}).in('id',ids));
      if(kind==='bsp'){await q(sb.from(T.req).update({sup_id:v}).in('id',ids));await Promise.all(rs.filter(r=>r.status!=='new').map(r=>upsertPos({...r,sup_id:v})))}
    },`Оновлено заявок: ${rs.length}`);return}
  if(t.dataset.sf&&['pay_days','prepay_pct'].includes(t.dataset.sf)){const v=Math.round(+t.value),mx=t.dataset.sf==='pay_days'?365:100;if(!(v>=0&&v<=mx)){toast(`Вкажіть від 0 до ${mx}`);return}const id=U.sup;act(()=>q(sb.from(T.sup).update({[t.dataset.sf]:v}).eq('id',id)),'Збережено');return}
  if(t.dataset.sf){let v=t.value.trim();if(t.dataset.sf==='site')v=v.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');const id=U.sup;act(()=>q(sb.from(T.sup).update({[t.dataset.sf]:v}).eq('id',id)),'Збережено')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){U.q=t.value;render()}
  if(t.id==='sq'){U.sq=t.value;render()}
  if(t.classList.contains('cq'))catalogSearch(t);
  if(t.classList.contains('it-t')||t.classList.contains('it-u')){const it=t.closest('.item');if(t.classList.contains('it-t')&&it.dataset.pos){const p=D.positions.find(x=>x.id===it.dataset.pos);if(p&&norm(p.title)!==norm(t.value))delete it.dataset.pos}setTimeout(()=>dupHint(it),0)}
  if(t.classList.contains('it-u')){const it=t.closest('.item');it.dataset.sup=guessSup(t.value)||'';it.querySelector('.picked').textContent=isA&&it.dataset.sup?'Постачальник визначено за посиланням: '+(sup(it.dataset.sup)?.name||''):''}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='whof'){const n=val('w-n');if(!n){$('#w-err').textContent="Вкажіть ім'я.";return}ME={name:n,dept:val('w-d')};saveMe();render();return}
  if(f.id==='lgf'){
    $('#l-go').disabled=true;$('#l-err').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:val('l-e'),password:$('#l-p').value});
    if(error){$('#l-err').textContent='Невірний email або пароль.';$('#l-go').disabled=false;return}
    await checkAdmin();
    if(!isA){$('#l-err').textContent='Цей акаунт не має доступу адміністратора.';$('#l-go').disabled=false;return}
    closeOv();U.loading=true;render();loadAll();return}
  if(f.id==='ngf'){const n=val('ngn');if(!n)return;act(async()=>{const g=await q(sb.from(T.grp).insert({name:n}).select().single());U.group=g.id},'Групу створено');return}
  if(f.id==='skf'){
    const name=val('sk-n'),dv=+val('sk-d');if(!name){$('#sk-err').textContent='Вкажіть назву.';return}if(!(dv>0)){$('#sk-err').textContent='Дільник має бути більшим за 0.';return}
    const rs=D.requests.filter(r=>r.group_id===M.gid);if(!rs.length){$('#sk-err').textContent='У групі немає заявок.';return}
    $('#sk-go').disabled=true;
    try{const k=await q(sb.from(T.kit).insert({name}).select().single());
      await q(sb.from(T.kitI).insert(rs.slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)).map((r,i)=>({kit_id:k.id,title:r.title,url:r.url||null,pos_id:r.pos_id||null,qty:Math.max(0.01,Math.round(r.qty/dv*100)/100),unit:r.unit,sup_id:r.sup_id||null,category_id:r.category_id||null,note:r.note||'',sort:i}))));U.kit=k.id}
    catch(e2){$('#sk-err').textContent='Не вдалося: '+(e2.message||e2);$('#sk-go').disabled=false;return}
    closeOv();U.tab='tpl';toast(`Шаблон «${name}» збережено`);loadAll();return}
  if(f.id==='kuf'){
    const m=+val('ku-m'),name=val('ku-n');if(!(m>0)){$('#ku-err').textContent='Множник має бути більшим за 0.';return}if(!name){$('#ku-err').textContent='Вкажіть назву групи.';return}
    $('#ku-go').disabled=true;
    try{const g=await kitToGroup(M.kid,m,name);U.group=g.id}catch(e2){$('#ku-err').textContent='Не вдалося: '+(e2.message||e2);$('#ku-go').disabled=false;return}
    closeOv();U.tab='req';U.status='all';toast(`Створено групу «${name}»`);loadAll();return}
  if(f.id==='nschf'){
    const name=val('ns-n'),ev=Math.round(+val('ns-e')),d=val('ns-d');
    if(!name){$('#ns-err').textContent='Вкажіть назву.';return}if(!(ev>=1&&ev<=365)){$('#ns-err').textContent='Періодичність — від 1 до 365 днів.';return}if(!d){$('#ns-err').textContent='Вкажіть першу дату.';return}
    act(()=>q(sb.from(T.sch).insert({name,kit_id:val('ns-k')||null,every_days:ev,next_date:d,category_id:val('ns-c')||null})),'Регулярну закупівлю додано');return}
  if(f.id==='invf'){
    const n=val('iv-n'),sum=val('iv-s')===''?null:+val('iv-s'),st=val('iv-st');
    const due=val('iv-due');
    if(!n&&sum==null&&!st&&!due){$('#iv-err').textContent='Заповніть хоча б одне поле.';return}
    if(sum!=null&&!(sum>=0)){$('#iv-err').textContent='Сума має бути числом.';return}
    const rs=D.requests.filter(r=>M.ids.includes(r.id));
    const priced=rs.every(r=>posOf(r)?.price),w=rs.map(r=>(priced?+posOf(r).price:1)*(+r.qty||0)),W=w.reduce((a,b)=>a+b,0)||1;
    let left=sum;
    const patches=rs.map((r,i)=>{const p={};if(n)p.inv=n;if(due)p.pay_due=due;if(sum!=null){const a=i===rs.length-1?Math.round(left*100)/100:Math.round(sum*w[i]/W*100)/100;left-=a;p.amount=a}if(st&&st!==r.status)Object.assign(p,statusPatch(r,st));return p});
    $('#iv-go').disabled=true;
    try{await Promise.all(rs.map((r,i)=>q(sb.from(T.req).update(patches[i]).eq('id',r.id))));for(const [i,r] of rs.entries()){const nn={...r,...patches[i]};if(nn.status!=='new'&&(nn.sup_id||!nn.url))await upsertPos(nn)}}
    catch(e2){$('#iv-err').textContent='Не вдалося: '+(e2.message||e2);$('#iv-go').disabled=false;return}
    U.sel.clear();closeOv();toast(`Рахунок застосовано до ${rs.length} заявок`);loadAll();return}
  if(f.id==='rpf'){
    const name=val('rp-n'),err=$('#rp-err');if(!name){err.textContent='Вкажіть назву групи.';return}
    const ids=[...document.querySelectorAll('.rp-c:checked')].map(x=>x.dataset.id);if(!ids.length){err.textContent='Виберіть хоча б одну позицію.';return}
    const qs={};document.querySelectorAll('.rp-q').forEach(x=>qs[x.dataset.id]=+x.value);
    if(ids.some(id=>!(qs[id]>0))){err.textContent='Вкажіть кількість, більшу за 0, для всіх вибраних позицій.';return}
    const src=D.requests.filter(r=>ids.includes(r.id)),old=grp(M.gid);
    $('#rp-go').disabled=true;
    try{
      const g=await q(sb.from(T.grp).insert({name}).select().single());
      await q(sb.from(T.req).insert(src.map(r=>({title:r.title,url:r.url||null,pos_id:r.pos_id||null,qty:qs[r.id],unit:r.unit,author_name:r.author_name,author_dept:r.author_dept||'',note:r.note||'',urgent:false,sup_id:r.sup_id||null,category_id:r.category_id||null,group_id:g.id}))));
      U.group=g.id;
    }catch(e2){err.textContent='Не вдалося створити: '+(e2.message||e2);$('#rp-go').disabled=false;return}
    closeOv();U.status='all';toast(`Створено групу «${name}» з ${src.length} заявками`);loadAll();return}
  if(f.id==='ncf'){const n=val('ncn');if(!n)return;act(()=>q(sb.from(T.cat).insert({name:n})),'Категорію створено');return}
  if(f.id==='nsf'){const n=val('nsn');if(!n)return;act(async()=>{const s=await q(sb.from(T.sup).insert({name:n}).select().single());U.sup=s.id;U.sq=''});return}
  if(f.id==='npf'){const t=val('np-t'),u=val('np-u');if(!t||!/^https?:\/\//.test(u)){toast('Вкажіть назву і посилання з https://');return}const row={sup_id:U.sup==='__none'?null:U.sup,title:t,url:u,unit:val('np-un'),manual:true};if(val('np-p'))row.price=+val('np-p');act(()=>q(sb.from(T.pos).upsert(row,{onConflict:'url'})),'Позицію додано');return}
  if(f.id==='nrf'){
    const who=val('f-who'),err=$('#f-err');
    if(!who){err.textContent="Вкажіть своє ім'я.";return}
    const its=[...document.querySelectorAll('#items .item')].map(it=>({t:it.querySelector('.it-t').value.trim(),u:it.querySelector('.it-u').value.trim(),q:+it.querySelector('.it-q').value,un:it.querySelector('.it-un').value,sup:it.dataset.sup||null,pos:it.dataset.pos||null}));
    for(const [i,x] of its.entries()){
      const m=!x.t?'вкажіть назву.':x.u&&!/^https?:\/\/\S+\.\S+/.test(x.u)?'посилання має починатися з https://':!(x.q>0)?'вкажіть кількість, більшу за 0.':'';
      if(m){err.textContent=(its.length>1?`Позиція ${i+1}: `:'')+m.charAt(0).toUpperCase()+m.slice(1);return}
    }
    ME={name:who,dept:val('f-dept')};saveMe();
    const common={author_name:who,author_dept:ME.dept,note:val('f-n'),urgent:$('#f-urg').checked,category_id:val('f-c')||null};
    if(isA)common.group_id=val('f-g')||null;
    const rows=its.map(x=>({title:x.t,url:x.u||null,pos_id:x.pos,qty:x.q,unit:x.un,sup_id:x.sup||guessSup(x.u),...common}));
    $('#f-go').disabled=true;
    try{await q(sb.from(T.req).insert(rows))}catch(e2){err.textContent='Не вдалося зберегти: '+(e2.message||e2);$('#f-go').disabled=false;return}
    closeOv();U.tab='req';U.status='all';toast(rows.length>1?`Створено заявок: ${rows.length}`:'Заявку створено');loadAll();return}
  if(f.id==='erf'){
    const r=D.requests.find(x=>x.id===M.id);
    const t=val('e-t'),u=val('e-u'),qn=+val('e-q');
    if(!validate(t,u,qn,'#e-err',undefined,!!r.pos_id))return;
    const patch={title:t,url:u||null,qty:qn,unit:val('e-un'),note:val('e-n'),group_id:val('e-g')||null,category_id:val('e-c')||null,sup_id:val('e-sp')||null,inv:val('e-inv'),amount:val('e-am')?+val('e-am'):null,vn:val('e-vn'),car:val('e-car'),ttn:val('e-ttn'),eta:val('e-eta')||null,adm:val('e-adm'),pay_terms:val('e-pt')||null,pay_days:val('e-pd')===''?null:Math.round(+val('e-pd')),pay_due:val('e-due')||null,prepaid_on:val('e-pre')||null,paid_on:val('e-paid')||null};
    if(patch.pay_days!=null&&!(patch.pay_days>=0&&patch.pay_days<=365)){$('#e-err').textContent='Днів відстрочки — від 0 до 365.';return}
    let k=val('e-s'),auto=false;
    if(k===r.status){if(patch.vn&&!r.vn&&k!=='got'){k='got';auto=true}else if(patch.ttn&&!r.ttn&&['new','invoice','pay'].includes(k)){k='paid';auto=true}}
    if(k!==r.status){const sp=statusPatch({...r,...patch,sup_id:patch.sup_id||r.sup_id},k,patch.eta);if(patch.eta)delete sp.eta;for(const f of ['paid_on','prepaid_on','pay_due'])if(patch[f])delete sp[f];Object.assign(patch,sp)}
    const btn=f.querySelector('.btn.pri');btn.disabled=true;$('#e-err').textContent='';
    try{
      if((patch.status||r.status)!=='new'&&!patch.sup_id)patch.sup_id=D.positions.find(p=>p.id===r.pos_id)?.sup_id||await ensureSup(patch.url);
      await q(sb.from(T.req).update(patch).eq('id',r.id));
      const n={...r,...patch};if(n.status!=='new'&&(n.sup_id||!n.url))await upsertPos(n);
      if(n.status==='new'||n.url!==r.url)await syncPos(r,r.id);
    }catch(err){$('#e-err').textContent='Не вдалося зберегти: '+(err.message||err);btn.disabled=false;return}
    closeOv();toast(auto?`Збережено · статус автоматично: «${stT(k)}»`:'Збережено');loadAll()}
});
/* перетягування заявок у групи */
let drag=[];
document.addEventListener('dragstart',e=>{const tr=e.target.closest&&e.target.closest('tr[data-id]');if(!tr)return;const id=tr.dataset.id;drag=U.sel.has(id)?[...U.sel]:[id];e.dataTransfer.setData('text/plain',drag.join(','));e.dataTransfer.effectAllowed='move';tr.classList.add('dragging')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));setTimeout(()=>drag=[],0)});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d||!drag.length)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==d&&x.classList.remove('over'));d.classList.add('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d||!drag.length)return;e.preventDefault();const [kind,raw]=d.dataset.drop.split(':');const v=raw==='none'?null:raw,f=kind==='c'?'category_id':'group_id';const ids=drag.slice(),n=ids.length;drag=[];U.sel.clear();
  D.requests.forEach(r=>{if(ids.includes(r.id))r[f]=v});render();
  const nm=kind==='c'?cat(v)?.name:grp(v)?.name;
  act(()=>q(sb.from(T.req).update({[f]:v}).in('id',ids)),v?`Переміщено в «${nm}»: ${n}`:(kind==='c'?`Прибрано категорію: ${n}`:`Прибрано з групи: ${n}`))});

/* ---------- старт ---------- */
(async()=>{
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase){U.loading=false;render();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  render();
  try{await checkAdmin()}catch(e){}
  await loadAll();
  setInterval(()=>{if(!document.hidden&&!M&&!drag.length)loadAll()},30000);
})();
}
</script>
